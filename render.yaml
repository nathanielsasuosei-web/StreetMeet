# Render Blueprint - "New +" → "Blueprint" → pick this repo.
services:
  - type: web
    name: natthesisa-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: APP_URL
        sync: false
      - key: MOMO_PROVIDER
        value: mock
      - key: MOMO_CURRENCY
        value: GHS
      - key: TURN_URLS
        value: stun:stun.l.google.com:19302
