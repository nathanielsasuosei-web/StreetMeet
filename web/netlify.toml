[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# Proxy API + websockets to Render so the browser only talks to one origin.
[[redirects]]
  from = "/api/*"
  to = "https://natthesisa-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://natthesisa-api.onrender.com/socket.io/:splat"
  status = 200
  force = true

# Client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
